name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install WiX
        run: winget install --id WiXToolset.WiXToolset -e --accept-package-agreements --accept-source-agreements

      - name: Build MSI
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build-msi.ps1

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            revit-agent.msi
            revit-agent.msi.sha256
